<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Folio — AI Document Chat</title>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
 
<style>
  :root {
    --ink:        #1d2420;
    --ink-soft:   #4b564f;
    --paper:      #f5f1e6;
    --paper-deep: #ece4d1;
    --panel:      #fffdf7;
    --line:       #ded3b5;
    --forest:      #1f4d3a;
    --forest-deep:#163627;
    --gold:       #b8893f;
    --gold-soft:  #e7d9b4;
    --rust:       #9a4b32;
    --user-bubble:#1f4d3a;
    --ai-bubble:  transparent;
    --shadow:      0 1px 2px rgba(29,36,32,.02);
    --shadow-lg:  0 4px 24px -12px rgba(29,36,32,.1);
    --radius:     16px;
  }
 
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    height: 100vh;
    height: 100svh; /* Prevents virtual keyboard layout shifts */
    font-family: 'Source Sans 3', sans-serif;
    color: var(--ink);
    background: var(--panel);
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
 
  .app {
    position: relative;
    width: 100%;
    max-width: 840px;
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--panel);
  }
 
  /* ---------- Top Bar Layout (ChatGPT / Gemini style) ---------- */
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(222, 211, 181, 0.4);
    background: var(--panel);
    z-index: 10;
  }
 
  .masthead .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
 
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(155deg, var(--forest), var(--forest-deep));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 16px; height: 16px; }
 
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0;
    color: var(--ink);
  }
 
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--ink-soft);
    background: var(--paper);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--forest);
  }
 
  /* ---------- Slim Inline Document Management ---------- */
  .doc-card {
    background: var(--paper);
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
  }
 
  .doc-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
 
  .file-label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    overflow: hidden;
  }
  .file-label input[type="file"] { display: none; }
 
  .file-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--gold-soft);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .file-icon svg { width: 14px; height: 14px; }
 
  #fileName {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
  }
  .file-sub {
    font-size: 11px;
    color: var(--ink-soft);
  }
 
  .btn {
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 8px 14px;
    transition: background .12s;
    white-space: nowrap;
  }
 
  .btn-primary {
    background: var(--forest);
    color: var(--paper);
  }
  .btn-primary:hover { background: var(--forest-deep); }
 
  .spin {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid rgba(245,241,230,.35);
    border-top-color: var(--paper);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
 
  /* ---------- Clean, Frameless Streaming Chat Box ---------- */
  #chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: var(--panel);
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  #chatBox::-webkit-scrollbar { width: 5px; }
  #chatBox::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
 
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--ink-soft);
    max-width: 300px;
    padding: 20px;
  }
  .empty-state svg { width: 28px; height: 28px; color: var(--gold); margin-bottom: 8px; }
  .empty-state p { font-size: 13.5px; line-height: 1.5; margin: 0; }
  .empty-state .et { font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink); margin-bottom: 4px; font-style: italic;}
 
  .msg {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 100%;
    animation: rise .22s ease-out both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
 
  .msg.user {
    flex-direction: row-reverse;
  }
 
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    margin-top: 4px;
  }
  .msg.user .avatar { display: none; } /* Hide user avatar for modern minimalist look */
  .msg.ai .avatar { background: linear-gradient(155deg, var(--forest), var(--forest-deep)); color: var(--paper); }
 
  .bubble {
    padding: 10px 16px;
    max-width: 85%;
    font-size: 15px;
    line-height: 1.55;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  
  /* Modern Chat Bubbles */
  .msg.user .bubble {
    background: var(--paper-deep);
    color: var(--ink);
    border-radius: 18px 18px 4px 18px;
    margin-left: auto;
  }
  .msg.ai .bubble {
    background: var(--ai-bubble);
    color: var(--ink);
    border-radius: 0;
    padding-left: 0;
    max-width: calc(100% - 40px);
  }
 
  .bubble.thinking {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 12px 4px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(.7); opacity: .4; }
    40% { transform: scale(1.1); opacity: 1; }
  }
 
  /* ---------- Premium Persistent Input Field ---------- */
  .input-container {
    padding: 12px 16px 24px;
    background: var(--panel);
    border-top: 1px solid rgba(222, 211, 181, 0.3);
  }
  
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 14px;
    border: 1.5px solid var(--line);
    border-radius: 24px;
    background: var(--panel);
    transition: border-color .15s, box-shadow .15s;
  }
  .input-row:focus-within {
    border-color: var(--forest);
    box-shadow: 0 0 0 3px rgba(31,77,58,.08);
  }
 
  #queryInput {
    flex: 1;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 15px;
    border: none;
    background: transparent;
    color: var(--ink);
    outline: none;
    padding: 6px 0;
  }
  #queryInput::placeholder { color: #9c9583; }
 
  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--forest);
    border: none;
    color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .12s, transform .1s;
  }
  .send-btn:hover { background: var(--forest-deep); }
  .send-btn:active { transform: scale(.92); }
  .send-btn svg { width: 16px; height: 16px; }
 
  @media (max-width: 600px) {
    #chatBox { padding: 16px 16px 30px; gap: 20px; }
    .bubble { font-size: 14.5px; max-width: 90%; }
    .input-container { padding: 10px 12px 16px; }
    #fileName { max-width: 110px; }
  }
</style>
</head>
 
<body>
 
<div class="app">
 
  <!-- ===== Masthead ===== -->
  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#f5f1e6" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M15 4v3h3" stroke="#f5f1e6" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8 11h8M8 14h8M8 17h5" stroke="#e7d9b4" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Folio</h1>
      </div>
    </div>
 
    <div class="status-pill">
      <div class="status-dot"></div>
      <span>Connected</span>
    </div>
  </div>
 
  <!-- ===== Slim Document Tray ===== -->
  <div class="doc-card">
    <div class="doc-row">
      <label class="file-label">
        <input type="file" id="fileInput" accept=".pdf,.txt" onchange="updateFileName()">
        <div class="file-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M14 3v6h6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <div id="fileName">default.pdf</div>
          <div class="file-sub">Tap to browse pdf or txt file</div>
        </div>
      </label>
 
      <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()">
        <span id="uploadBtnLabel">Upload</span>
      </button>
    </div>
  </div>
 
  <!-- ===== Chat Space ===== -->
  <div id="chatBox">
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <div class="et">Ask your document anything</div>
      <p>Upload a file above to begin a fluid conversation.</p>
    </div>
  </div>
 
  <!-- ===== Persistent Action Bar ===== -->
  <div class="input-container">
    <div class="input-row">
      <input
        type="text"
        id="queryInput"
        placeholder="Message Folio..."
        onkeydown="if(event.key==='Enter') askQuestion()"
        autocomplete="off"
      >
      <button class="send-btn" onclick="askQuestion()" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
 
</div>
 
<script>
  const BACKEND_URL = '';
  let chosenFile = null;

  function updateFileName() {
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    if (fileInput.files.length > 0) {
      chosenFile = fileInput.files[0];
      fileNameDisplay.textContent = chosenFile.name;
    }
  }

  async function uploadFile() {
    if (!chosenFile) {
      alert("Please select a file first.");
      return;
    }

    const uploadBtnLabel = document.getElementById('uploadBtnLabel');
    uploadBtnLabel.innerHTML = '<div class="spin"></div>';
    
    const formData = new FormData();
    formData.append('file', chosenFile);

    try {
      const response = await fetch(`${BACKEND_URL}/api/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      
      if (response.ok) {
        alert("Document linked beautifully! Ask away.");
      } else {
        alert("Upload error: " + data.error);
      }
    } catch (err) {
      console.error(err);
      alert("Failed to connect to backend.");
    } finally {
      uploadBtnLabel.textContent = "Upload";
    }
  }

  async function askQuestion() {
    const queryInput = document.getElementById('queryInput');
    const chatBox = document.getElementById('chatBox');
    const emptyState = document.getElementById('emptyState');
    const questionText = queryInput.value.trim();

    if (!questionText) return;

    if (emptyState) emptyState.style.display = 'none';

    appendMessage(questionText, 'user');
    queryInput.value = '';
    
    // Smooth scroll down instantly for user action
    scrollToBottom();

    const thinkingId = appendThinkingIndicator();
    scrollToBottom();

    try {
      const response = await fetch(`${BACKEND_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: questionText })
      });
      const data = await response.json();

      document.getElementById(thinkingId).remove();
      
      if (response.ok) {
        appendMessage(data.answer, 'ai');
      } else {
        appendMessage("Error: " + (data.error || "Something went wrong."), 'ai');
      }
    } catch (err) {
      document.getElementById(thinkingId).remove();
      appendMessage("Could not communicate with server.", 'ai');
    }
    
    scrollToBottom();
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender}`;
    
    // Clean modern format: text content without container borders for AI
    msgDiv.innerHTML = `
      ${sender === 'ai' ? '<div class="avatar">AI</div>' : ''}
      <div class="bubble">${text}</div>
    `;
    chatBox.appendChild(msgDiv);
  }

  function appendThinkingIndicator() {
    const chatBox = document.getElementById('chatBox');
    const id = 'thinking-' + Date.now();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ai';
    msgDiv.id = id;
    
    msgDiv.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble thinking">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    chatBox.appendChild(msgDiv);
    return id;
  }

  function scrollToBottom() {
    const chatBox = document.getElementById('chatBox');
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
</body>
</html>
