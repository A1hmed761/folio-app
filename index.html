<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — AI Document Chat</title>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
 
<style>
  :root{
    --ink:        #1d2420;
    --ink-soft:   #4b564f;
    --paper:      #f5f1e6;
    --paper-deep: #ece4d1;
    --panel:      #fffdf7;
    --line:       #ded3b5;
    --forest:     #1f4d3a;
    --forest-deep:#163627;
    --gold:       #b8893f;
    --gold-soft:  #e7d9b4;
    --rust:       #9a4b32;
    --user-bubble:#1f4d3a;
    --ai-bubble:  #fffdf7;
    --shadow:     0 1px 2px rgba(29,36,32,.04), 0 8px 24px -8px rgba(29,36,32,.12);
    --shadow-lg:  0 2px 4px rgba(29,36,32,.06), 0 24px 48px -16px rgba(29,36,32,.2);
    --radius:     14px;
  }
 
  *{ box-sizing: border-box; }
 
  body{
    margin:0;
    min-height:100vh;
    font-family:'Source Sans 3', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(184,137,63,.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(31,77,58,.08), transparent 45%),
      var(--paper);
    display:flex;
    justify-content:center;
    padding: 48px 24px;
  }
 
  /* faint paper grain via layered noise-ish gradient lines */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(
      0deg, rgba(29,36,32,0.012) 0px, rgba(29,36,32,0.012) 1px,
      transparent 1px, transparent 3px
    );
    z-index:0;
  }
 
  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:880px;
  }
 
  /* ---------- Header ---------- */
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    padding-bottom:18px;
    border-bottom: 1px solid var(--line);
  }
 
  .masthead .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
 
  .brand-mark{
    width:38px; height:38px;
    border-radius:9px;
    background: linear-gradient(155deg, var(--forest), var(--forest-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
    flex-shrink:0;
  }
  .brand-mark svg{ width:19px; height:19px; }
 
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
 
  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
    font-family:'Fraunces', serif;
  }
 
  .status-pill{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 12px;
    white-space:nowrap;
  }
  .status-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--forest);
    box-shadow:0 0 0 3px rgba(31,77,58,.15);
  }
 
  /* ---------- Document card ---------- */
  .doc-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }
 
  .doc-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
 
  .doc-eyebrow{
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
 
  .doc-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
 
  .file-label{
    flex:1;
    min-width:200px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    background:var(--paper);
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:13px 16px;
    transition: border-color .18s ease, background .18s ease;
  }
  .file-label:hover{
    border-color: var(--gold);
    background: var(--gold-soft);
  }
  .file-label input[type="file"]{ display:none; }
 
  .file-icon{
    width:30px; height:30px;
    border-radius:7px;
    background: var(--gold-soft);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .file-icon svg{ width:15px; height:15px; }
 
  #fileName{
    font-size:14px;
    font-weight:500;
    color: var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .file-sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
 
  .btn{
    font-family:'Source Sans 3', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    padding:13px 20px;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    white-space:nowrap;
  }
  .btn:active{ transform: translateY(1px); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
 
  .btn-primary{
    background: linear-gradient(155deg, var(--forest), var(--forest-deep));
    color: var(--paper);
    box-shadow: 0 4px 14px -4px rgba(31,77,58,.5);
  }
  .btn-primary:hover:not(:disabled){
    box-shadow: 0 6px 18px -4px rgba(31,77,58,.6);
  }
 
  .btn-spinner{
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .spin{
    width:13px; height:13px;
    border-radius:50%;
    border:2px solid rgba(245,241,230,.35);
    border-top-color: var(--paper);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
 
  /* ---------- Chat panel ---------- */
  .chat-card{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    overflow:hidden;
  }
 
  .chat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 22px;
    border-bottom:1px solid var(--line);
    background: linear-gradient(180deg, rgba(184,137,63,.05), transparent);
  }
 
  .chat-head-title{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chat-head-title svg{ width:15px; height:15px; color:var(--gold); }
 
  #chatBox{
    height:420px;
    overflow-y:auto;
    padding:24px 22px;
    display:flex;
    flex-direction:column;
    gap:16px;
    background:
      repeating-linear-gradient(transparent, transparent 38px, rgba(184,137,63,.06) 39px);
  }
  #chatBox::-webkit-scrollbar{ width:8px; }
  #chatBox::-webkit-scrollbar-thumb{ background: var(--line); border-radius:8px; }
  #chatBox::-webkit-scrollbar-track{ background: transparent; }
 
  .empty-state{
    margin: auto;
    text-align:center;
    color: var(--ink-soft);
    max-width:280px;
  }
  .empty-state svg{ width:34px; height:34px; color: var(--gold); margin-bottom:10px; }
  .empty-state p{ font-size:14px; line-height:1.55; margin:0; }
  .empty-state .et{ font-family:'Fraunces',serif; font-size:17px; color:var(--ink); margin-bottom:6px; font-style:italic;}
 
  .msg{
    display:flex;
    gap:10px;
    max-width:82%;
    animation: rise .28s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
 
  .msg.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg.ai{ align-self:flex-start; }
 
  .avatar{
    width:30px; height:30px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:12px;
    font-weight:700;
    margin-top:2px;
  }
  .msg.user .avatar{ background: var(--gold-soft); color: var(--gold); }
  .msg.ai .avatar{ background: linear-gradient(155deg, var(--forest), var(--forest-deep)); color: var(--paper); }
 
  .bubble{
    padding:11px 15px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    box-shadow: var(--shadow);
    word-wrap: break-word;
  }
  .msg.user .bubble{
    background: var(--user-bubble);
    color: var(--paper);
    border-top-right-radius:4px;
  }
  .msg.ai .bubble{
    background: var(--ai-bubble);
    color: var(--ink);
    border:1px solid var(--line);
    border-top-left-radius:4px;
  }
 
  .bubble.thinking{
    display:flex;
    gap:5px;
    align-items:center;
    padding:13px 16px;
  }
  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--gold);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2){ animation-delay:.15s; }
  .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%, 80%, 100%{ transform: scale(.6); opacity:.5; }
    40%{ transform: scale(1); opacity:1; }
  }
 
  /* ---------- Input row ---------- */
  .input-row{
    display:flex;
    gap:10px;
    padding:16px 22px 20px;
    border-top:1px solid var(--line);
    background: var(--panel);
  }
 
  #queryInput{
    flex:1;
    font-family:'Source Sans 3', sans-serif;
    font-size:14.5px;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:11px;
    background: var(--paper);
    color: var(--ink);
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #queryInput::placeholder{ color: #8b8473; }
  #queryInput:focus{
    border-color: var(--forest);
    box-shadow: 0 0 0 3px rgba(31,77,58,.13);
  }
 
  .send-btn{
    width:46px; height:46px;
    border-radius:11px;
    background: linear-gradient(155deg, var(--forest), var(--forest-deep));
    border:none;
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 4px 14px -4px rgba(31,77,58,.5);
  }
  .send-btn:hover{ box-shadow: 0 6px 18px -4px rgba(31,77,58,.6); }
  .send-btn:active{ transform: scale(.94); }
  .send-btn svg{ width:18px; height:18px; }
 
  footer{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color: var(--ink-soft);
  }
 
  @media (max-width: 560px){
    body{ padding:24px 14px; }
    .masthead{ flex-direction:column; align-items:flex-start; gap:10px; }
    .doc-row{ flex-direction:column; align-items:stretch; }
    .btn-primary{ width:100%; }
    #chatBox{ height:360px; }
  }
 
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
 
<body>
 
<div class="app">
 
  <!-- ===== Masthead ===== -->
  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#f5f1e6" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M15 4v3h3" stroke="#f5f1e6" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8 11h8M8 14h8M8 17h5" stroke="#e7d9b4" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Folio</h1>
        <div class="tagline">Read closely. Ask anything.</div>
      </div>
    </div>
 
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Ready to chat</span>
    </div>
  </div>
 
  <!-- ===== Document card ===== -->
  <div class="doc-card">
    <div class="doc-card-top">
      <span class="doc-eyebrow">Source document</span>
    </div>
 
    <div class="doc-row">
      <label class="file-label">
        <input type="file" id="fileInput" accept=".pdf,.txt" onchange="updateFileName()">
        <span class="file-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M14 3v6h6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <div id="fileName">default.pdf</div>
          <div class="file-sub">Click to browse · PDF or TXT</div>
        </div>
      </label>
 
      <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()">
        <span id="uploadBtnLabel">Replace document</span>
      </button>
    </div>
  </div>
 
  <!-- ===== Chat card ===== -->
  <div class="chat-card">
    <div class="chat-head">
      <div class="chat-head-title">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 16l-5.6 3.1 1.4-6.3-4.8-4.3 6.4-.6L12 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Conversation
      </div>
    </div>
 
    <div id="chatBox">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        <div class="et">Nothing here yet</div>
        <p>Upload a document above, then ask a question to begin the conversation.</p>
      </div>
    </div>
 
    <div class="input-row">
      <input
        type="text"
        id="queryInput"
        placeholder="Ask something about the document…"
        onkeydown="if(event.key==='Enter') askQuestion()"
      >
      <button class="send-btn" onclick="askQuestion()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
 
  <footer>Documents are processed locally by your backend · nothing leaves this page without your upload</footer>
 
</div>
 
<script>
  const BACKEND_URL = 'https://folio-app-vedn.onrender.com';
  let chosenFile = null;

  function updateFileName() {
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    if (fileInput.files.length > 0) {
      chosenFile = fileInput.files[0];
      fileNameDisplay.textContent = chosenFile.name;
    }
  }

  async function uploadFile() {
    if (!chosenFile) {
      alert("Please select a file first.");
      return;
    }

    const uploadBtnLabel = document.getElementById('uploadBtnLabel');
    uploadBtnLabel.innerHTML = '<div class="spin"></div> Uploading...';
    
    const formData = new FormData();
    formData.append('file', chosenFile);

    try {
      const response = await fetch(`${BACKEND_URL}/api/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      
      if (response.ok) {
        alert("Document linked! You can now start asking questions.");
      } else {
        alert("Upload error: " + data.error);
      }
    } catch (err) {
      console.error(err);
      alert("Failed to connect to the Node.js backend.");
    } finally {
      uploadBtnLabel.textContent = "Replace document";
    }
  }

  async function askQuestion() {
    const queryInput = document.getElementById('queryInput');
    const chatBox = document.getElementById('chatBox');
    const emptyState = document.getElementById('emptyState');
    const questionText = queryInput.value.trim();

    if (!questionText) return;

    // Remove empty state placeholder on first message
    if (emptyState) emptyState.style.display = 'none';

    // Append User Message to UI
    appendMessage(questionText, 'user');
    queryInput.value = '';

    // Append Typing/Thinking Placeholder
    const thinkingId = appendThinkingIndicator();
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const response = await fetch(`${BACKEND_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: questionText })
      });
      const data = await response.json();

      // Remove loading indicator and print response
      document.getElementById(thinkingId).remove();
      
      if (response.ok) {
        appendMessage(data.answer, 'ai');
      } else {
        appendMessage("Error: " + (data.error || "Something went wrong."), 'ai');
      }
    } catch (err) {
      document.getElementById(thinkingId).remove();
      appendMessage("Could not communicate with server.", 'ai');
    }
    
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender}`;
    
    msgDiv.innerHTML = `
      <div class="avatar">${sender === 'user' ? 'U' : 'AI'}</div>
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
    `;
    chatBox.appendChild(msgDiv);
  }

  function appendThinkingIndicator() {
    const chatBox = document.getElementById('chatBox');
    const id = 'thinking-' + Date.now();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ai';
    msgDiv.id = id;
    
    msgDiv.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble thinking">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    `;
    chatBox.appendChild(msgDiv);
    return id;
  }
</script>
</body>
</html>
