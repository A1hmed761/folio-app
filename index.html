<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Folio — AI Document Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:#1d2420; --ink-soft:#4b564f; --paper:#f5f1e6; --paper-deep:#ece4d1;
    --panel:#fffdf7; --line:#ded3b5; --forest:#1f4d3a; --forest-deep:#163627;
    --gold:#b8893f; --gold-soft:#e7d9b4; --rust:#9a4b32; --ok:#2e7d52; --ok-soft:#e3f1e8;
    --err-soft:#f7e4dd;
    --ai-bubble:transparent;
    --shadow-lg:0 8px 28px -14px rgba(29,36,32,.28);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; height:100vh; height:100svh;
    font-family:'Source Sans 3',sans-serif; color:var(--ink);
    background:linear-gradient(180deg,var(--paper) 0%,var(--paper-deep) 100%);
    display:flex; justify-content:center; overflow:hidden;
  }
  .app {
    position:relative; width:100%; max-width:840px; height:100%;
    display:flex; flex-direction:column; background:var(--panel);
    box-shadow:0 0 60px -30px rgba(29,36,32,.35);
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px; border-bottom:1px solid rgba(222,211,181,.5);
    background:var(--panel); z-index:10;
  }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand-mark {
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(155deg,var(--forest),var(--forest-deep));
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 4px 10px -4px rgba(31,77,58,.6);
  }
  .brand-mark svg { width:17px; height:17px; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin:0; letter-spacing:-.2px; }
  .head-right { display:flex; align-items:center; gap:8px; }
  .status-pill {
    display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
    color:var(--ink-soft); background:var(--paper); border-radius:999px; padding:5px 11px;
    transition:background .25s,color .25s;
  }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--gold); transition:background .25s; }
  .status-pill.ready { background:var(--ok-soft); color:var(--ok); }
  .status-pill.ready .status-dot { background:var(--ok); box-shadow:0 0 0 3px rgba(46,125,82,.18); }
  .icon-btn {
    width:32px; height:32px; border-radius:50%; border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s,color .15s;
  }
  .icon-btn:hover { background:var(--paper); color:var(--forest); }
  .icon-btn svg { width:17px; height:17px; }
  button:focus-visible,.dropzone:focus-within,.chip:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Upload card ---------- */
  .doc-card { padding:12px 20px; background:var(--paper); border-bottom:1px solid var(--line); }
  .doc-row { display:flex; align-items:center; gap:10px; }

  .dropzone {
    position:relative; flex:1; min-width:0; display:flex; align-items:center; gap:12px;
    padding:10px 12px; border:1.5px dashed #c9b98d; border-radius:12px;
    background:var(--panel); cursor:pointer; overflow:hidden;
    transition:border-color .2s,background .2s,transform .15s;
  }
  .dropzone:hover { border-color:var(--forest); }
  .dropzone.drag { border-color:var(--forest); background:var(--ok-soft); transform:scale(1.01); }
  .dropzone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; font-size:0; }

  .file-icon {
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:var(--gold-soft); color:var(--gold);
    display:flex; align-items:center; justify-content:center; transition:background .25s,color .25s;
  }
  .file-icon svg { width:19px; height:19px; }
  .file-icon .i-done,.file-icon .i-err { display:none; }
  .file-text { min-width:0; flex:1; }
  #fileName { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .file-sub { font-size:12px; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .progress { position:absolute; left:0; right:0; bottom:0; height:3px; background:transparent; }
  .progress i { display:block; height:100%; width:0; background:var(--forest); transition:width .2s ease; }

  /* States: idle | selected | uploading | done | error */
  .doc-card[data-state="selected"] .dropzone { border-style:solid; border-color:var(--gold); }
  .doc-card[data-state="uploading"] .dropzone { border-style:solid; border-color:var(--forest); cursor:progress; }
  .doc-card[data-state="uploading"] .dropzone input { pointer-events:none; }
  .doc-card[data-state="done"] .dropzone { border-style:solid; border-color:var(--ok); background:var(--ok-soft); }
  .doc-card[data-state="done"] .file-icon { background:var(--ok); color:#fff; }
  .doc-card[data-state="done"] .file-icon .i-file { display:none; }
  .doc-card[data-state="done"] .file-icon .i-done { display:block; animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  .doc-card[data-state="done"] .file-sub { color:var(--ok); font-weight:600; }
  .doc-card[data-state="error"] .dropzone { border-style:solid; border-color:var(--rust); background:var(--err-soft); }
  .doc-card[data-state="error"] .file-icon { background:var(--rust); color:#fff; }
  .doc-card[data-state="error"] .file-icon .i-file { display:none; }
  .doc-card[data-state="error"] .file-icon .i-err { display:block; }
  .doc-card[data-state="error"] .file-sub { color:var(--rust); font-weight:600; }
  @keyframes pop { from { transform:scale(.4); opacity:0; } to { transform:scale(1); opacity:1; } }

  .btn {
    font-family:inherit; font-weight:600; font-size:13px; border:none; border-radius:10px;
    cursor:pointer; padding:11px 16px; white-space:nowrap; min-width:96px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .15s,opacity .15s,transform .1s;
  }
  .btn:active:not(:disabled) { transform:scale(.96); }
  .btn-primary { background:var(--forest); color:var(--paper); }
  .btn-primary:hover:not(:disabled) { background:var(--forest-deep); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.is-done { background:var(--ok); }
  .spin {
    width:13px; height:13px; border-radius:50%;
    border:2px solid rgba(245,241,230,.35); border-top-color:var(--paper); animation:spin .7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ---------- Chat ---------- */
  #chatBox {
    position:relative; flex:1; overflow-y:auto; padding:22px 20px;
    display:flex; flex-direction:column; gap:22px; background:var(--panel);
    scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
  }
  #chatBox::-webkit-scrollbar { width:5px; }
  #chatBox::-webkit-scrollbar-thumb { background:var(--line); border-radius:99px; }

  .empty-state { margin:auto; text-align:center; color:var(--ink-soft); max-width:380px; padding:20px; }
  .empty-state .badge {
    width:52px; height:52px; margin:0 auto 12px; border-radius:16px; background:var(--gold-soft);
    color:var(--gold); display:flex; align-items:center; justify-content:center; animation:float 3.4s ease-in-out infinite;
  }
  .empty-state .badge svg { width:26px; height:26px; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  .empty-state p { font-size:14px; line-height:1.55; margin:0; }
  .empty-state .et { font-family:'Fraunces',serif; font-size:21px; color:var(--ink); margin-bottom:6px; font-style:italic; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:18px; }
  .chip {
    font-family:inherit; font-size:13px; font-weight:500; color:var(--forest);
    background:var(--panel); border:1.5px solid var(--line); border-radius:999px;
    padding:7px 13px; cursor:pointer; transition:background .15s,border-color .15s,transform .1s;
  }
  .chip:hover { background:var(--ok-soft); border-color:var(--forest); }
  .chip:active { transform:scale(.96); }

  .msg { display:flex; gap:12px; width:100%; animation:rise .25s ease-out both; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .msg.user { flex-direction:row-reverse; }
  .avatar {
    width:28px; height:28px; border-radius:50%; flex-shrink:0; margin-top:4px;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }
  .msg.user .avatar { display:none; }
  .msg.ai .avatar { background:linear-gradient(155deg,var(--forest),var(--forest-deep)); color:var(--paper); }

  .col { display:flex; flex-direction:column; min-width:0; max-width:85%; }
  .msg.user .col { align-items:flex-end; }
  .bubble { padding:10px 16px; font-size:15px; line-height:1.6; word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap; }
  .msg.user .bubble {
    background:var(--forest); color:var(--paper); border-radius:18px 18px 4px 18px;
    box-shadow:0 4px 12px -6px rgba(31,77,58,.6);
  }
  .msg.ai .bubble { background:var(--ai-bubble); border-radius:0; padding-left:0; padding-top:6px; }
  .msg.ai .bubble.error { color:var(--rust); }
  .caret::after { content:''; display:inline-block; width:2px; height:1em; background:var(--gold); margin-left:2px; vertical-align:text-bottom; animation:blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  .meta { display:flex; align-items:center; gap:10px; margin-top:2px; font-size:11.5px; color:#9c9583; opacity:0; transition:opacity .2s; }
  .msg:hover .meta,.msg:focus-within .meta { opacity:1; }
  .msg.user .meta { padding-right:4px; }
  .copy-btn { display:flex; align-items:center; gap:4px; font:inherit; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:3px 6px; border-radius:6px; }
  .copy-btn:hover { background:var(--paper); color:var(--forest); }
  .copy-btn svg { width:13px; height:13px; }
  @media (hover:none) { .meta { opacity:1; } }

  .bubble.thinking { display:flex; gap:4px; align-items:center; padding:12px 4px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--gold); animation:bounce 1.1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay:.15s; } .dot:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,80%,100% { transform:scale(.7); opacity:.4; } 40% { transform:scale(1.1); opacity:1; } }

  .to-bottom {
    position:absolute; right:18px; bottom:106px; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel); color:var(--forest); cursor:pointer;
    box-shadow:var(--shadow-lg); display:none; align-items:center; justify-content:center; z-index:5;
  }
  .to-bottom.show { display:flex; animation:rise .2s both; }
  .to-bottom svg { width:16px; height:16px; }

  /* ---------- Input ---------- */
  .input-container { padding:12px 16px 22px; background:var(--panel); border-top:1px solid rgba(222,211,181,.35); }
  .input-row {
    display:flex; align-items:center; gap:8px; padding:6px 6px 6px 16px;
    border:1.5px solid var(--line); border-radius:26px; background:var(--panel);
    transition:border-color .15s,box-shadow .15s;
  }
  .input-row:focus-within { border-color:var(--forest); box-shadow:0 0 0 4px rgba(31,77,58,.09); }
  #queryInput { flex:1; font-family:inherit; font-size:15px; border:none; background:transparent; color:var(--ink); outline:none; padding:7px 0; min-width:0; }
  #queryInput::placeholder { color:#9c9583; }
  .send-btn {
    width:36px; height:36px; border-radius:50%; background:var(--forest); border:none; color:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:background .12s,transform .1s,opacity .15s;
  }
  .send-btn:hover:not(:disabled) { background:var(--forest-deep); }
  .send-btn:active:not(:disabled) { transform:scale(.9); }
  .send-btn:disabled { opacity:.35; cursor:not-allowed; }
  .send-btn svg { width:17px; height:17px; }
  .hint { text-align:center; font-size:11.5px; color:#9c9583; margin-top:8px; }

  /* ---------- Toast ---------- */
  .toast {
    position:fixed; top:16px; left:50%; transform:translate(-50%,-90px); z-index:50;
    display:flex; align-items:center; gap:9px; max-width:calc(100% - 32px);
    padding:11px 16px; border-radius:12px; font-size:13.5px; font-weight:600;
    background:var(--forest-deep); color:var(--paper); box-shadow:0 12px 30px -10px rgba(0,0,0,.45);
    transition:transform .35s cubic-bezier(.2,1.2,.4,1);
  }
  .toast.show { transform:translate(-50%,0); }
  .toast.error { background:var(--rust); }

  @media (max-width:600px) {
    .masthead,.doc-card { padding-left:14px; padding-right:14px; }
    #chatBox { padding:16px 14px 30px; gap:20px; }
    .bubble { font-size:14.5px; }
    .col { max-width:92%; }
    .input-container { padding:10px 12px 16px; }
    .btn { min-width:84px; padding:11px 12px; }
    .status-pill span { display:none; }
    .status-pill { padding:7px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>

<body>
<div class="app">

  <!-- ===== Masthead ===== -->
  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#f5f1e6" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M15 4v3h3" stroke="#f5f1e6" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8 11h8M8 14h8M8 17h5" stroke="#e7d9b4" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>Folio</h1>
    </div>
    <div class="head-right">
      <div class="status-pill" id="statusPill" title="Document status">
        <div class="status-dot"></div>
        <span id="statusText">No document yet</span>
      </div>
      <button class="icon-btn" onclick="clearChat()" aria-label="Clear conversation" title="Clear conversation">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== Upload card ===== -->
  <div class="doc-card" id="docCard" data-state="idle">
    <div class="doc-row">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".pdf,.txt" onchange="updateFileName()">
        <div class="file-icon">
          <svg class="i-file" viewBox="0 0 24 24" fill="none"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v6h6" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <svg class="i-done" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="i-err" viewBox="0 0 24 24" fill="none"><path d="M12 7v6M12 17h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </div>
        <div class="file-text">
          <div id="fileName">Choose or drop a document</div>
          <div class="file-sub" id="fileSub">PDF or TXT · small files work best</div>
        </div>
        <div class="progress"><i id="progressBar"></i></div>
      </label>
      <button class="btn btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>
        <span id="uploadBtnLabel">Upload</span>
      </button>
    </div>
  </div>

  <!-- ===== Chat ===== -->
  <div id="chatBox" role="log" aria-live="polite">
    <div class="empty-state" id="emptyState">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </div>
      <div class="et">Ask your document anything</div>
      <p id="emptyText">Choose a PDF or TXT file above, then press Upload. You’ll see a green check when it’s ready.</p>
      <div class="chips" id="chips">
        <button class="chip" onclick="useChip(this)">Summarize this document</button>
        <button class="chip" onclick="useChip(this)">List the key points</button>
        <button class="chip" onclick="useChip(this)">What are the main conclusions?</button>
      </div>
    </div>
    <button class="to-bottom" id="toBottom" onclick="scrollToBottom()" aria-label="Scroll to latest message">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- ===== Input ===== -->
  <div class="input-container">
    <div class="input-row">
      <input type="text" id="queryInput" placeholder="Message Folio..." onkeydown="if(event.key==='Enter') askQuestion()" autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="askQuestion()" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">Upload a document first for answers based on your file.</div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const BACKEND_URL = '';
  const MAX_MB = 20;
  let chosenFile = null;
  let docReady = false;
  let busy = false;
  let toastTimer;

  const $ = id => document.getElementById(id);

  /* ---------- Helpers ---------- */
  function showToast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (type === 'error' ? ' error' : '');
    void t.offsetWidth;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }

  function setState(state, sub) {
    $('docCard').dataset.state = state;
    if (sub) $('fileSub').textContent = sub;
    const btn = $('uploadBtn'), label = $('uploadBtnLabel');
    btn.classList.remove('is-done');
    btn.disabled = false;
    if (state === 'idle')           { btn.disabled = true; label.textContent = 'Upload'; }
    else if (state === 'selected')  { label.textContent = 'Upload'; }
    else if (state === 'uploading') { btn.disabled = true; }
    else if (state === 'done')      { btn.disabled = true; btn.classList.add('is-done'); label.textContent = 'Uploaded'; }
    else if (state === 'error')     { label.textContent = 'Retry'; }
  }

  function setDocReady(ready) {
    docReady = ready;
    $('statusPill').classList.toggle('ready', ready);
    $('statusText').textContent = ready ? 'Document ready' : 'No document yet';
    $('hint').textContent = ready
      ? 'Folio answers from your uploaded document.'
      : 'Upload a document first for answers based on your file.';
    $('emptyText').textContent = ready
      ? 'Your document is ready. Ask a question or try a suggestion below.'
      : 'Choose a PDF or TXT file above, then press Upload. You’ll see a green check when it’s ready.';
  }

  /* ---------- File selection ---------- */
  function validateAndSet(file) {
    const ok = /\.(pdf|txt)$/i.test(file.name);
    if (!ok) { showToast('Only PDF or TXT files are supported.', 'error'); return false; }
    if (file.size > MAX_MB * 1048576) { showToast('That file is over ' + MAX_MB + ' MB. Try a smaller one.', 'error'); return false; }
    chosenFile = file;
    $('fileName').textContent = file.name;
    $('progressBar').style.width = '0';
    setDocReady(false);
    setState('selected', fmtSize(file.size) + ' · Press Upload to continue');
    return true;
  }

  function updateFileName() {
    const fileInput = $('fileInput');
    if (fileInput.files.length > 0) validateAndSet(fileInput.files[0]);
  }

  const dz = $('dropzone');
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0];
    if (f && validateAndSet(f)) {
      try { const dt = new DataTransfer(); dt.items.add(f); $('fileInput').files = dt.files; } catch (_) {}
    }
  });

  /* ---------- Upload (with real progress) ---------- */
  function uploadFile() {
    if (!chosenFile) {
      showToast('Choose a PDF or TXT file first.', 'error');
      return;
    }
    const label = $('uploadBtnLabel');
    setState('uploading', 'Uploading… 0%');
    label.innerHTML = '<div class="spin"></div> Uploading';

    const formData = new FormData();
    formData.append('file', chosenFile);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `${BACKEND_URL}/api/upload`);

    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round((e.loaded / e.total) * 100);
      $('progressBar').style.width = pct + '%';
      $('fileSub').textContent = pct < 100 ? 'Uploading… ' + pct + '%' : 'Processing document…';
    };

    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch (_) {}
      if (xhr.status >= 200 && xhr.status < 300) {
        $('progressBar').style.width = '100%';
        setState('done', 'Uploaded · ' + fmtSize(chosenFile.size) + ' · Ready to chat');
        setDocReady(true);
        showToast('Document uploaded. Ask away!');
        $('queryInput').focus();
      } else {
        setState('error', data.error || 'Upload failed. Press Retry.');
        $('progressBar').style.width = '0';
        showToast(data.error ? 'Upload error: ' + data.error : 'Upload failed.', 'error');
      }
    };

    xhr.onerror = () => {
      console.error('Upload failed');
      setState('error', 'Could not reach the server. Press Retry.');
      $('progressBar').style.width = '0';
      showToast('Failed to connect to backend.', 'error');
    };

    xhr.send(formData);
  }

  /* ---------- Chat ---------- */
  function useChip(el) {
    $('queryInput').value = el.textContent;
    askQuestion();
  }

  function clearChat() {
    const box = $('chatBox');
    box.querySelectorAll('.msg').forEach(m => m.remove());
    $('emptyState').style.display = '';
    $('toBottom').classList.remove('show');
  }

  async function askQuestion() {
    if (busy) return;
    const queryInput = $('queryInput');
    const emptyState = $('emptyState');
    const questionText = queryInput.value.trim();
    if (!questionText) return;

    if (emptyState) emptyState.style.display = 'none';

    appendMessage(questionText, 'user');
    queryInput.value = '';
    scrollToBottom();

    busy = true;
    $('sendBtn').disabled = true;
    const thinkingId = appendThinkingIndicator();
    scrollToBottom();

    try {
      const response = await fetch(`${BACKEND_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: questionText })
      });
      const data = await response.json();
      $(thinkingId).remove();

      if (response.ok) {
        await appendMessage(data.answer, 'ai', true);
      } else {
        appendMessage('Error: ' + (data.error || 'Something went wrong.'), 'ai', false, true);
      }
    } catch (err) {
      const t = $(thinkingId); if (t) t.remove();
      appendMessage('Could not communicate with server.', 'ai', false, true);
    }

    busy = false;
    $('sendBtn').disabled = false;
    queryInput.focus();
    scrollToBottom();
  }

  const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function appendMessage(text, sender, animate, isError) {
    const chatBox = $('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender}`;
    text = String(text == null ? '' : text);

    // Build with DOM nodes so text is never interpreted as HTML
    if (sender === 'ai') {
      const av = document.createElement('div');
      av.className = 'avatar'; av.textContent = 'AI';
      msgDiv.appendChild(av);
    }
    const col = document.createElement('div'); col.className = 'col';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (isError ? ' error' : '');
    col.appendChild(bubble);

    const meta = document.createElement('div'); meta.className = 'meta';
    const time = document.createElement('span');
    time.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    meta.appendChild(time);
    if (sender === 'ai' && !isError) {
      const cb = document.createElement('button');
      cb.className = 'copy-btn'; cb.innerHTML = COPY_ICON + '<span>Copy</span>';
      cb.onclick = () => {
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(() => { cb.querySelector('span').textContent = 'Copied'; setTimeout(() => cb.querySelector('span').textContent = 'Copy', 1500); })
          .catch(() => showToast('Copy not available in this browser.', 'error'));
      };
      meta.appendChild(cb);
    }
    col.appendChild(meta);
    msgDiv.appendChild(col);
    chatBox.appendChild(msgDiv);

    if (!animate) { bubble.textContent = text; return Promise.resolve(); }

    // Gentle typewriter reveal for AI answers
    return new Promise(resolve => {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { bubble.textContent = text; return resolve(); }
      const step = Math.max(2, Math.ceil(text.length / 220));
      let i = 0;
      bubble.classList.add('caret');
      (function tick() {
        i = Math.min(text.length, i + step);
        bubble.textContent = text.slice(0, i);
        if (isNearBottom()) chatBox.scrollTop = chatBox.scrollHeight;
        if (i < text.length) requestAnimationFrame(tick);
        else { bubble.classList.remove('caret'); resolve(); }
      })();
    });
  }

  function appendThinkingIndicator() {
    const chatBox = $('chatBox');
    const id = 'thinking-' + Date.now();
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ai';
    msgDiv.id = id;
    msgDiv.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble thinking">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    chatBox.appendChild(msgDiv);
    return id;
  }

  function isNearBottom() {
    const c = $('chatBox');
    return c.scrollHeight - c.scrollTop - c.clientHeight < 120;
  }

  function scrollToBottom() {
    const chatBox = $('chatBox');
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  $('chatBox').addEventListener('scroll', () => {
    $('toBottom').classList.toggle('show', !isNearBottom());
  });
</script>
</body>
</html>
